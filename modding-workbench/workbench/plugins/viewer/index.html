<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/unit_panel.css">
<script src="/static/unit_panel.js"></script>
<script src="/static/nav.js" defer></script>
<style>
  /* The Workbench studio (see studio/main.js): forms and slots on the left, the stage in the middle, the inspector on the right, the bar at the
     bottom. Below 900px wide: form and slot pickers above the stage, and the inspector as a bottom sheet. */
  :root { --bg: #170d12; --panel: #211819; --line: #3e2a2c; --text: #e9dfcf; --muted: #a8998a; --gold: #a8803f;
          --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Libre Caslon Text", Georgia, serif; overflow: hidden; }
  button, select { min-height: 36px; background: linear-gradient(#5b1714, #360b0a); color: var(--text); border: 1px solid #a8442f; border-radius: 4px;
                   padding: 0 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button.on { background: linear-gradient(#8a2a1f, #571310); border-color: #d8a640; }
  button:disabled { opacity: .4; cursor: default; }
  .note { font-size: 12px; color: var(--muted); }

  #app { position: fixed; inset: calc(env(safe-area-inset-top, 0px) + var(--nav-h, 38px)) var(--sar) 0 var(--sal); display: grid;
         grid-template-columns: 250px minmax(0, 1fr) 420px; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "forms stage inspector" "bar bar bar"; }

  /* Left: forms and slots. */
  #left { grid-area: forms; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #left .p-head { margin: 6px 6px 2px; }
  #forms { overflow: auto; max-height: 45%; padding: 0 6px 6px; }
  #forms .grp { color: #d8a640; font-size: 12px; margin: 8px 4px 2px; }
  #forms button, #slots button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px;
                                 min-height: 32px; }
  #forms button.on, #slots button.on { background: #8a2a1f; }
  #details { color: var(--muted); font-size: 10px; word-break: break-all; padding: 4px 10px; }
  #search { margin: 2px 6px; min-height: 32px; padding: 0 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px; font: inherit; }
  #slots, #forms { overflow-x: hidden; }
  #slots { overflow-y: auto; flex: 1; padding: 0 6px 6px; }
  #slots button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #slots .tag { font-size: 11px; color: var(--muted); }
  #pickers { display: none; }

  /* Middle: the stage. */
  #stage { grid-area: stage; position: relative; background: #14161a; min-height: 0; }
  #battle { position: absolute; inset: 0; }
  #battle canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #stageModes { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; z-index: 2; }
  #battleTools { position: absolute; top: 8px; right: 8px; left: 180px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; z-index: 2; }
  #battleTools > span { display: contents; }
  #sides button:not(.on) { opacity: .55; }
  #info { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; pointer-events: none; z-index: 2; }
  #info span { background: rgba(20,22,26,.8); padding: 2px 6px; border-radius: 3px; word-break: break-all; }
  #status { position: absolute; top: 45%; left: 0; right: 0; text-align: center; color: var(--muted); pointer-events: none; }
  /* The portholes fit the stage both ways: one fills it, two share its width. */
  #portraitStage { position: absolute; inset: 52px 12px 12px; display: flex; gap: 16px; justify-content: center; align-items: center; container-type: size; }
  #portraitStage figure { margin: 0; flex: none; width: min(48cqw, calc(100cqh - 30px)); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #portraitStage figure:first-child:has(+ figure[hidden]) { width: min(100cqw, calc(100cqh - 30px)); }
  #portraitStage figcaption { font-size: 12px; color: var(--muted); text-align: center; }
  .porthole { position: relative; width: 100%; aspect-ratio: 1; }
  .porthole canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  /* The in-game glass: a dark rim inside the gold ring. The ring's inner edge is the circle the camera was calibrated against. */
  .porthole .mask { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
                    background: radial-gradient(circle closest-side, transparent 0 88%, rgba(10,8,6,.55) 95%, rgba(10,8,6,.9) 100%);
                    box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px #3b2a14; }
  .porthole .guides { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; overflow: hidden; }
  .porthole .guides::before, .porthole .guides::after { content: ""; position: absolute; background: rgba(255,255,255,.35); }
  .porthole .guides::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .porthole .guides::after { top: 50%; left: 0; right: 0; height: 1px; }

  /* Right: the inspector. */
  #inspector { grid-area: inspector; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #grab { display: none; }
  #tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #inspBody { overflow: auto; flex: 1; padding: 6px; }
  #inspBody .panel { box-shadow: none; max-height: none; }
  #inspBody .vs button { min-height: 28px; margin-left: auto; font-size: 12px; }
  .tools { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; }
  .arow { display: grid; grid-template-columns: 110px 1fr 68px; gap: 6px; align-items: center; padding: 0 4px; }
  .arow label { font-size: 12px; color: var(--muted); }
  .arow input[type=range] { width: 100%; height: 34px; accent-color: #8aa4d6; }
  .arow input[type=number] { min-height: 32px; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; font: inherit; }
  .copyline { display: flex; gap: 6px; padding: 6px 4px; }
  .copyline code { flex: 1; min-width: 0; font: 11px/1.4 ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px;
                   word-break: break-all; user-select: all; }
  #sheetJobs { display: none; }

  /* Bottom: playback and jobs. */
  #bar { grid-area: bar; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
         padding: 6px 8px calc(var(--sab) + 6px); }
  #frame { flex: 1; min-width: 120px; accent-color: #8aa4d6; }
  #fnum { min-width: 52px; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #jobs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #log { position: fixed; right: 12px; bottom: 64px; width: min(560px, calc(100vw - 24px)); max-height: 40vh; overflow: auto; margin: 0; z-index: 30;
         background: #120c0c; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 11px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }

  @media (max-width: 899px) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "pickers" "stage" "inspector" "bar"; }
    #left { display: none; }
    #pickers { grid-area: pickers; display: flex; gap: 4px; padding: 4px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #pickers select { flex: 1; min-width: 0; }
    #battleTools { left: 150px; }
    #battleTools button, #battleTools select, #stageModes button { min-height: 32px; padding: 0 7px; font-size: 12px; }
    #info { display: none; }
    /* The inspector is a sheet between the stage and the bar, so the stage shrinks above it: only its tabs (peek), half the screen, or most of it. */
    #inspector { border: 0; border-top: 2px solid #6b5233; border-radius: 12px 12px 0 0; height: 46vh; box-shadow: 0 -6px 18px rgba(0,0,0,.6); }
    #inspector[data-sheet="peek"] { height: auto; }
    #inspector[data-sheet="peek"] #inspBody, #inspector[data-sheet="peek"] #sheetJobs { display: none; }
    #inspector[data-sheet="full"] { height: 72vh; }
    #grab { display: block; width: 100%; min-height: 22px; background: none; border: 0; }
    #grab::before { content: ""; display: block; width: 44px; height: 5px; margin: 0 auto; background: #6b5233; border-radius: 3px; }
    #sheetJobs { display: flex; padding: 6px; border-top: 1px solid var(--line); }
    #portraitStage { inset: 46px 8px 8px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="p-head">Forms</div>
    <div id="forms"></div>
    <div class="p-head">Slots</div>
    <input id="search" placeholder="Filter (CAST, FLY, STAND)" autocomplete="off">
    <div id="slots"></div>
    <div id="details"></div>
  </aside>
  <div id="pickers"><select id="formSel" aria-label="Form"></select><select id="slotSel" aria-label="Slot"></select></div>
  <main id="stage">
    <div id="battle"></div>
    <div id="portraitStage" hidden></div>
    <div id="stageModes"><button data-mode="battle" class="on">Battle</button><button data-mode="portrait" id="modePortrait">Portrait</button></div>
    <div id="battleTools"><span id="sides"></span><span id="toggles"></span></div>
    <div id="info"></div>
    <div id="status">Loading...</div>
  </main>
  <aside id="inspector" data-sheet="peek">
    <button id="grab" aria-label="Resize the panel"></button>
    <div id="tabs"></div>
    <div id="inspBody"></div>
    <div id="sheetJobs"></div>
  </aside>
  <footer id="bar">
    <button id="play">Pause</button>
    <select id="speed" aria-label="Speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
    <input type="range" id="frame" min="0" max="0" value="0" aria-label="Frame">
    <span id="fnum">0/0</span>
    <span id="barJobs"><span id="jobs"></span></span>
  </footer>
</div>
<pre id="log" hidden></pre>
<script type="module" src="studio/main.js"></script>
</body>
</html>
