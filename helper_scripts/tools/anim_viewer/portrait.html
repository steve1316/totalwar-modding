<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portrait Camera</title>
<style>
  :root { --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #d8dbe0; --muted: #8a909a; --on: #3a4558; --gold: #a8803f;
          --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: calc(var(--sat) + 10px) 16px calc(var(--sab) + 24px); display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  a { color: #8aa4d6; }
  #portholes { display: flex; gap: 12px; justify-content: center; }
  figure { margin: 0; flex: 1; max-width: min(100%, 62vh); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  figcaption { font-size: 12px; color: var(--muted); text-align: center; }
  .porthole { position: relative; width: 100%; aspect-ratio: 1; }
  .porthole canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; touch-action: pan-y; }
  /* The in-game glass: a dark rim inside the gold ring. The ring's inner edge is the circle the camera was calibrated against. */
  .porthole .mask { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
                    background: radial-gradient(circle closest-side, transparent 0 88%, rgba(10,8,6,.55) 95%, rgba(10,8,6,.9) 100%);
                    box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px #3b2a14; }
  .porthole .guides { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; overflow: hidden; }
  .porthole .guides::before, .porthole .guides::after { content: ""; position: absolute; background: rgba(255,255,255,.35); }
  .porthole .guides::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .porthole .guides::after { top: 50%; left: 0; right: 0; height: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select { min-height: 48px; min-width: 48px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                   padding: 0 14px; font: inherit; cursor: pointer; }
  button.on { background: var(--on); border-color: #56627a; }
  .presets button { flex: 1 1 auto; padding: 0 10px; font-size: 14px; }
  .slider { display: grid; grid-template-columns: 52px 1fr 92px; gap: 10px; align-items: center; }
  .slider label { font-weight: 600; }
  .slider input[type=number] { min-height: 48px; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                               padding: 0 8px; font: inherit; font-variant-numeric: tabular-nums; text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; background: transparent; margin: 0; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: var(--line); border-radius: 4px; }
  input[type=range]::-moz-range-track { height: 8px; background: var(--line); border-radius: 4px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -13px; border-radius: 50%; background: #8aa4d6;
                                            border: 3px solid var(--bg); }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: #8aa4d6; border: 3px solid var(--bg); }
  #copyLine { display: flex; gap: 8px; align-items: stretch; }
  #json { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 13px/1.4 ui-monospace, monospace;
          word-break: break-all; user-select: all; -webkit-user-select: all; }
  #note { font-size: 12px; color: var(--muted); }
  #status { color: var(--muted); text-align: center; font-size: 13px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<main>
  <header><h1>Advisor portrait camera</h1><a href="index.html">Gallery</a></header>
  <div id="portholes">
    <figure><div class="porthole" id="mine"></div><figcaption id="mineCap"></figcaption></figure>
    <figure id="refFig" hidden><div class="porthole" id="ref"></div><figcaption id="refCap"></figcaption></figure>
  </div>
  <div id="status">Loading...</div>
  <div class="row" id="looks"></div>
  <div class="row">
    <button id="play">Play</button>
    <button id="guidesBtn">Guides</button>
    <button id="refBtn">Vanilla ref</button>
  </div>
  <div class="slider"><label for="pose">pose</label><input type="range" id="pose" min="0" max="0" step="1"><span id="poseNum"></span></div>
  <div id="sliders"></div>
  <div class="row presets" id="presets"></div>
  <div id="copyLine"><div id="json"></div><button id="copy">Copy</button></div>
  <div id="note"></div>
</main>
<script type="module">
import * as THREE from "three";
import { animLoader, loadModel } from "./viewer_common.js";

// //////////////////////////////////////////////////////////////////////////////////////////////////
// //////////////////////////////////////////////////////////////////////////////////////////////////
// Camera model
//
// Calibrated against in-game porthole screenshots of rounds 1, 2, 3 and 5 (see the mod's RESEARCH_NOTES.md):
// - The camera looks at a target straight above the head bone of frame 0: `y` metres above it, plus `ANCHOR_DY`.
// - It sits `z` plus `DISTANCE_PAD` metres from that target, along its own view axis. `pitch` swings it up around the target (positive looks
//   down on him) and `yaw` swings it around him. So `pitch` changes the angle he is seen from more than where he sits in the frame.
// - `fov` is the vertical field of view. The visible circle spans the full fov, so its diameter is the render's height.
// - Fitted 2026-10-13: at pitch 8 the eye line lands within ~0.065 of the radius and the hood width within ~10%. Round 1 (pitch 0) is
//   off by ~0.11 of the radius.
const ANCHOR_DY = -0.037;
const DISTANCE_PAD = 0.10;
// Idle frame shown by default. The in-game shots show the head turned ~10 degrees, as in frames 75-93 of the idle.
const POSE_FRAME = 84;
// Slider ranges: [key, min, max, step].
const FIELDS = [["z", 0.3, 2.5, 0.01], ["y", -0.25, 0.35, 0.005], ["yaw", -60, 60, 0.5], ["pitch", -30, 40, 0.5], ["fov", 10, 60, 0.5]];

const $ = id => document.getElementById(id);
const manifest = await (await fetch("manifest.json")).json();
const data = manifest.portrait;
if (!data) { $("status").textContent = "This export has no portrait data. Rebuild the gallery."; throw new Error("no portrait data"); }

// //////////////////////////////////////////////////////////////////////////////////////////////////
// //////////////////////////////////////////////////////////////////////////////////////////////////
// Loading

// Loads a model once, without its rigid props (weapons): the porthole does not show them.
const models = new Map();
function getModel(url) {
  if (!models.has(url)) models.set(url, loadModel(url, { props: false }));
  return models.get(url);
}

// //////////////////////////////////////////////////////////////////////////////////////////////////
// //////////////////////////////////////////////////////////////////////////////////////////////////
// Portholes

// One round render: its own renderer, scene, camera and posed model.
class Porthole {
  constructor(host) {
    this.host = host;
    this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    host.append(this.renderer.domElement);
    const mask = document.createElement("div"); mask.className = "mask"; host.append(mask);
    this.guides = document.createElement("div"); this.guides.className = "guides"; this.guides.hidden = true; host.append(this.guides);
    this.scene = new THREE.Scene();
    // Neutral dark backdrop, a little lighter in the middle like the in-game glass.
    this.scene.background = backdrop();
    this.scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x2a2622, 1.3));
    const key = new THREE.DirectionalLight(0xfff1dc, 1.9); key.position.set(-1.2, 2.2, 2.5); this.scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fb8d8, 0.6); rim.position.set(1.5, 1.0, -1.0); this.scene.add(rim);
    this.camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
    this.model = null;
  }
  setModel(model) {
    if (this.model) this.scene.remove(this.model.group);
    this.model = model; if (model) this.scene.add(model.group);
    this.map = model ? model.bones.map(b => anim.index.get(b.name) ?? -1) : null;
  }
  // Places the camera from portrait settings values, around the head bone of frame 0.
  setCamera(v) {
    const pitch = THREE.MathUtils.degToRad(v.pitch), yaw = THREE.MathUtils.degToRad(v.yaw);
    const target = new THREE.Vector3(head0.x, head0.y + v.y + ANCHOR_DY, head0.z);
    const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
    this.camera.position.copy(target).addScaledVector(dir, v.z + DISTANCE_PAD);
    this.camera.fov = v.fov; this.camera.updateProjectionMatrix(); this.camera.lookAt(target); this.camera.updateMatrixWorld();
  }
  render(frame) {
    const size = Math.round(this.host.clientWidth);
    if (size && size !== this.size) { this.size = size; this.renderer.setSize(size, size, false); }
    if (this.model) {
      const base = frame * anim.count * 7, d = anim.data;
      this.model.bones.forEach((b, k) => {
        const i = this.map[k]; if (i < 0) return;
        const o = base + i * 7; b.position.set(d[o], d[o + 1], d[o + 2]); b.quaternion.set(d[o + 3], d[o + 4], d[o + 5], d[o + 6]);
      });
    }
    this.renderer.render(this.scene, this.camera);
  }
}

// A soft radial backdrop texture.
function backdrop() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), grad = g.createRadialGradient(128, 110, 10, 128, 128, 180);
  grad.addColorStop(0, "#4a525c"); grad.addColorStop(1, "#1c2127");
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const anim = await animLoader(manifest)(data.anim);
const headIndex = anim.index.get("head");
const head0 = new THREE.Vector3(anim.data[headIndex * 7], anim.data[headIndex * 7 + 1], anim.data[headIndex * 7 + 2]);
const mine = new Porthole($("mine")), ref = new Porthole($("ref"));

// //////////////////////////////////////////////////////////////////////////////////////////////////
// //////////////////////////////////////////////////////////////////////////////////////////////////
// Controls

const values = { ...data.camera };
const inputs = {};
for (const [key, min, max, step] of FIELDS) {
  const row = document.createElement("div"); row.className = "slider";
  row.innerHTML = `<label for="r_${key}">${key}</label><input type="range" id="r_${key}" min="${min}" max="${max}" step="${step}">` +
                  `<input type="number" id="n_${key}" step="${step}" inputmode="decimal" aria-label="${key}">`;
  $("sliders").append(row);
  const range = row.querySelector("input[type=range]"), number = row.querySelector("input[type=number]");
  range.oninput = () => setValues({ [key]: +range.value });
  number.onchange = () => { if (number.value !== "" && isFinite(+number.value)) setValues({ [key]: +number.value }); };
  inputs[key] = { range, number };
}

// A number in the registry's style: at least one decimal, at most three.
const fmt = v => { const r = Math.round(v * 1000) / 1000; return Number.isInteger(r) ? r.toFixed(1) : String(r); };
function setValues(changes, note) {
  Object.assign(values, changes);
  for (const [key] of FIELDS) {
    if (document.activeElement !== inputs[key].number) inputs[key].number.value = fmt(values[key]);
    inputs[key].range.value = values[key];
  }
  $("json").textContent = `"camera_head": {"z": ${fmt(values.z)}, "y": ${fmt(values.y)}, "yaw": ${fmt(values.yaw)}, "pitch": ${fmt(values.pitch)}, "fov": ${fmt(values.fov)}}`;
  $("mineCap").textContent = `z ${fmt(values.z)}  y ${fmt(values.y)}  pitch ${fmt(values.pitch)}  yaw ${fmt(values.yaw)}  fov ${fmt(values.fov)}`;
  if (note !== undefined) $("note").textContent = note;
  mine.setCamera(values);
  history.replaceState(null, "", "#" + FIELDS.map(([k]) => `${k}=${fmt(values[k])}`).join("&") + `&look=${look}`);
}

// Presets: the registry's values (reset) and every round tried in game.
const presets = [{ label: "Reset", camera: data.camera, note: "Registry values (portrait.camera_head)." }]
  .concat(data.rounds.map((r, i) => ({ label: `R${i + 1}`, camera: r.camera, note: `Round ${i + 1} in game: ${r.note}.` })));
for (const p of presets) {
  const b = document.createElement("button"); b.textContent = p.label; b.onclick = () => setValues({ ...p.camera }, p.note); $("presets").append(b);
}

// Looks: hooded, hoodless.
let look = 0;
async function setLook(i) {
  look = i;
  [...$("looks").children].forEach((b, k) => b.classList.toggle("on", k === i));
  mine.setModel(await getModel(data.looks[i].model));
  setValues({});
}
data.looks.forEach((l, i) => { const b = document.createElement("button"); b.textContent = l.name; b.onclick = () => setLook(i); $("looks").append(b); });

// Vanilla reference, side by side, with its own vanilla values.
if (data.reference) {
  const c = data.reference.camera;
  $("refCap").textContent = `${data.reference.name}: z ${fmt(c.z)}  y ${fmt(c.y)}  pitch ${fmt(c.pitch)}`;
  $("refBtn").onclick = async () => {
    const show = $("refFig").hidden; $("refFig").hidden = !show; $("refBtn").classList.toggle("on", show);
    if (show && !ref.model) { ref.setModel(await getModel(data.reference.model)); ref.setCamera(c); }
  };
} else $("refBtn").hidden = true;

// Pose: the idle frame shown. Play runs the idle, pausing keeps the frame it reached.
let playing = false, time = (POSE_FRAME + 0.5) / anim.fps;
const frameAt = () => Math.min(anim.frames - 1, Math.floor(time * anim.fps));
$("pose").max = anim.frames - 1;
$("pose").oninput = () => { time = (+$("pose").value + 0.5) / anim.fps; if (playing) $("play").click(); };
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("guidesBtn").onclick = () => { const on = mine.guides.hidden; mine.guides.hidden = ref.guides.hidden = !on; $("guidesBtn").classList.toggle("on", on); };

// Copy: the clipboard API needs https, so over the LAN fall back to a selection copy.
$("copy").onclick = async () => {
  const text = $("json").textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const range = document.createRange(); range.selectNodeContents($("json"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); document.execCommand("copy");
  }
  $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1200);
};

// Start from the URL hash when it has values, else from the registry.
const params = new URLSearchParams(location.hash.slice(1)), start = {};
for (const [key] of FIELDS) if (params.has(key) && isFinite(+params.get(key))) start[key] = +params.get(key);
Object.assign(values, start);
await setLook(Math.min(data.looks.length - 1, +(params.get("look") || 0)));
setValues({}, Object.keys(start).length ? "Values from the link." : presets[0].note);
$("status").hidden = true;

const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  if (playing) time = (time + dt) % (anim.frames / anim.fps);
  const frame = frameAt();
  $("pose").value = frame; $("poseNum").textContent = `${frame}/${anim.frames - 1}`;
  mine.render(frame);
  if (!$("refFig").hidden) ref.render(frame);
  requestAnimationFrame(tick);
}
tick();

// Hooks for scripted checks (Playwright).
// `renderNow` draws at once, since a hidden or headless tab may not run animation frames.
window.portrait = { setValues, setLook, values, head0, mine, ref, THREE, renderNow: () => mine.render(frameAt()), setPose: f => { time = (f + 0.5) / anim.fps; }, ready: true };
</script>
</body>
</html>
